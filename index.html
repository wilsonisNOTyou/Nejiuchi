<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ネジ打ち</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{
  --bg:#14171c;          /* 工場の暗がり */
  --panel:#2a2f38;       /* 鋼板 */
  --panel-hi:#3a414d;
  --line:#4a5262;
  --amber:#f5b301;       /* 安全色のイエロー */
  --amber-dim:#8a6a10;
  --steel:#aeb8c6;
  --ok:#5fd08a;
  --miss:#ff5c5c;
  --cyan:#5fc9d0;        /* タイムアタック */
  --ink:#e8ecf2;
  font-size:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  background:var(--bg);
  background-image:
    repeating-linear-gradient(45deg, transparent 0 34px, rgba(255,255,255,.015) 34px 36px),
    radial-gradient(ellipse at 50% -10%, #232a35 0%, var(--bg) 60%);
  color:var(--ink);
  font-family:'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
  min-height:100vh;
  display:flex; align-items:center; justify-content:center;
  overflow-x:hidden;
  user-select:none;
}
#app{width:min(760px,94vw); padding:2rem 0}
.screen{display:none; text-align:center}
.screen.active{display:block; animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- タイトル ---- */
.hazard{
  display:inline-block;
  background:repeating-linear-gradient(-45deg,var(--amber) 0 14px,#111 14px 28px);
  height:10px; width:min(520px,80vw); border-radius:2px; opacity:.9;
}
h1{
  font-size:clamp(2.6rem,8vw,4.4rem);
  letter-spacing:.12em;
  color:var(--amber);
  text-shadow:0 3px 0 #6b4e00, 0 6px 18px rgba(0,0,0,.6);
  margin:.3em 0 .1em;
}
.subtitle{color:var(--steel); letter-spacing:.25em; margin-bottom:1.6rem}
.mode-group{margin-bottom:1.3rem}
.mode-head{
  color:var(--steel); font-size:.95rem; letter-spacing:.3em;
  margin-bottom:.6rem; display:flex; align-items:center; gap:.8rem; justify-content:center;
}
.mode-head::before,.mode-head::after{
  content:''; height:1px; flex:1; max-width:110px; background:var(--line);
}
.mode-head .ta{color:var(--cyan)}
.mode-head .sa{color:var(--amber)}
.diff-row{display:flex; gap:.9rem; justify-content:center; flex-wrap:wrap}
.diff-btn{
  font-family:inherit; cursor:pointer;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  border:2px solid var(--line); border-radius:8px;
  color:var(--ink); padding:.75rem 1.1rem; width:200px;
  box-shadow:0 4px 0 #10131a;
  transition:transform .08s, box-shadow .08s, border-color .15s;
  text-align:left;
}
.diff-btn:hover, .diff-btn:focus-visible{border-color:var(--amber); outline:none; transform:translateY(-2px)}
.diff-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #10131a}
.diff-btn .name{font-size:1.25rem; color:var(--amber)}
.diff-btn .desc{font-size:.78rem; color:var(--steel); margin-top:.25rem; line-height:1.45}
.diff-btn .kbd{float:right; color:#6b7484; font-size:.85rem}
.diff-btn.ta{border-color:#33606b}
.diff-btn.ta .name{color:var(--cyan)}
.diff-btn.ta:hover,.diff-btn.ta:focus-visible{border-color:var(--cyan)}
.diff-btn.oneshot{border-color:#7a3b3b; width:min(300px,90vw)}
.diff-btn.oneshot .name{color:#ff8a5c}
.diff-btn.oneshot:hover,.diff-btn.oneshot:focus-visible{border-color:var(--miss)}
.best-line{color:var(--steel); font-size:.85rem; min-height:1.3em; line-height:1.6}
.hint{color:#6b7484; font-size:.78rem; margin-top:1.4rem; line-height:1.7}

/* ---- ゲーム画面 ---- */
.hud{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:.6rem; font-size:1rem; color:var(--steel)}
.hud b{color:var(--amber); font-size:1.6rem; margin:0 .15em}
.timebar{height:8px; background:#0d0f13; border-radius:4px; overflow:hidden; border:1px solid var(--line); margin-bottom:1.2rem}
.timebar>i{display:block; height:100%; background:linear-gradient(90deg,var(--amber),#ffd75e); width:100%; transition:width .1s linear}
.timebar>i.low{background:linear-gradient(90deg,#ff5c5c,#ff8a5c)}
.timebar>i.ta{background:linear-gradient(90deg,var(--cyan),#9fe4e8); transition:width .25s ease}

.word-panel{
  background:linear-gradient(180deg,#333a45,#262c36 55%,#2b323d);
  border:2px solid var(--line); border-radius:10px;
  padding:1.6rem 1rem 1.4rem; margin-bottom:1rem;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.4);
  position:relative;
}
/* 四隅のネジ(飾り) */
.word-panel::before,.word-panel::after,
.word-panel .corner::before,.word-panel .corner::after{
  content:''; position:absolute; width:14px; height:14px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #cfd6e0, #7d8794 55%, #4c5563);
  box-shadow:inset 0 -1px 2px rgba(0,0,0,.6);
}
.word-panel::before{top:8px;left:8px}
.word-panel::after{top:8px;right:8px}
.word-panel .corner::before{bottom:8px;left:8px}
.word-panel .corner::after{bottom:8px;right:8px}

#wordText{font-size:clamp(1.4rem,4.5vw,2.2rem); letter-spacing:.06em; margin-bottom:.4rem; min-height:1.3em}
#wordKana{font-size:1rem; color:var(--steel); margin-bottom:.9rem; min-height:1.2em}
#romaji{font-size:clamp(1.1rem,3.5vw,1.5rem); letter-spacing:.14em; font-family:'DotGothic16',monospace; min-height:1.3em}
#romaji .done{color:var(--ok)}
#romaji .rest{color:#7f8a9b}
.word-panel.shake{animation:shake .18s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* 次の語録の先読み(タイムアタック) */
#nextWord{
  color:#6b7484; font-size:.9rem; min-height:1.4em; margin-bottom:.9rem;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#nextWord .lbl{color:#525a68; margin-right:.5em; letter-spacing:.15em}

/* ---- ネジ板(シグネチャ) ---- */
.plate{
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.02) 0 2px, transparent 2px 4px),
    linear-gradient(180deg,#4a5261,#3a414d);
  border:2px solid var(--line); border-radius:8px;
  padding:1.1rem 1rem; display:flex; justify-content:center; gap:clamp(.5rem,3vw,1.4rem);
  box-shadow:0 6px 0 #10131a;
}
.screw{
  width:clamp(30px,6vw,44px); height:clamp(30px,6vw,44px); border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #e3e9f2, #97a1af 50%, #59616e 85%);
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.5);
  position:relative; transition:opacity .2s;
}
.screw::before,.screw::after{
  content:''; position:absolute; background:#3c434e; border-radius:2px;
  top:50%; left:50%;
}
.screw::before{width:62%; height:12%; transform:translate(-50%,-50%)}
.screw::after{width:12%; height:62%; transform:translate(-50%,-50%)}
.screw.gone{visibility:hidden}
.screw.out{animation:unscrew .55s ease-in forwards}
@keyframes unscrew{
  0%{transform:rotate(0) translateY(0); opacity:1}
  45%{transform:rotate(540deg) translateY(-14px); opacity:1}
  100%{transform:rotate(900deg) translateY(-70px); opacity:0}
}
.plate.drop{animation:platedrop .5s ease-in}
@keyframes platedrop{
  0%{transform:translateY(0) rotate(0)}
  100%{transform:translateY(16px) rotate(1.2deg); opacity:.2}
}

/* ---- リザルト ---- */
.result-count{font-size:clamp(3.5rem,12vw,6rem); color:var(--amber); text-shadow:0 4px 0 #6b4e00; margin:.2em 0}
.result-count.ta{color:var(--cyan); text-shadow:0 4px 0 #24555a}
.result-sub{color:var(--steel); margin-bottom:.4rem}
.result-new{color:var(--ok); font-size:1.1rem; min-height:1.4em; margin-bottom:1.4rem}
.btn-row{display:flex; gap:1rem; justify-content:center; margin-top:1rem; flex-wrap:wrap}
.btn{
  font-family:inherit; cursor:pointer; font-size:1rem;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  border:2px solid var(--line); border-radius:8px; color:var(--ink);
  padding:.8rem 1.6rem; box-shadow:0 4px 0 #10131a;
}
.btn:hover,.btn:focus-visible{border-color:var(--amber); outline:none}
.btn:active{transform:translateY(2px); box-shadow:0 1px 0 #10131a}
.btn.primary{color:#1b1405; background:linear-gradient(180deg,#ffd75e,var(--amber)); border-color:#c79100}

/* ---- ランキング ---- */
.name-input{
  font-family:inherit; font-size:1.05rem; color:var(--ink);
  background:#0d0f13; border:2px solid var(--line); border-radius:8px;
  padding:.7rem 1rem; width:min(280px,70vw); text-align:center; letter-spacing:.1em;
}
.name-input:focus{outline:none; border-color:var(--amber)}
.register{margin-bottom:.6rem}
.reg-status{color:var(--steel); font-size:.9rem; min-height:1.4em; margin-top:.6rem}
h2.rank-title{color:var(--amber); letter-spacing:.2em; margin-bottom:1rem; text-shadow:0 2px 0 #6b4e00}
.rank-tabs{display:flex; gap:.45rem; justify-content:center; margin-bottom:.5rem; flex-wrap:wrap}
.rank-tabs .btn{padding:.45rem .85rem; font-size:.85rem}
.rank-tabs .btn.active{color:#1b1405; background:linear-gradient(180deg,#ffd75e,var(--amber)); border-color:#c79100}
.rank-tabs .btn.ta.active{color:#08282b; background:linear-gradient(180deg,#9fe4e8,var(--cyan)); border-color:#3d8d95}
.tab-group-label{color:#6b7484; font-size:.75rem; letter-spacing:.2em; margin:.5rem 0 .3rem}
.rank-list{list-style:none; width:min(460px,90vw); margin:0 auto; text-align:left; max-height:42vh; overflow-y:auto}
.rank-row{
  display:flex; align-items:center; gap:.8rem;
  background:linear-gradient(180deg,var(--panel-hi),var(--panel));
  border:1px solid var(--line); border-radius:6px;
  padding:.55rem .9rem; margin-bottom:.45rem; font-size:1rem;
}
.rank-row .pos{color:var(--amber); width:2.6em; flex-shrink:0}
.rank-row .pname{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.rank-row .pscore{color:var(--amber); flex-shrink:0}
.rank-row.me{border-color:var(--amber); box-shadow:0 0 8px rgba(245,179,1,.3)}
.rank-row.top1 .pos{font-size:1.25em}

/* ---- ペナルティ / 辞典 ---- */
.screw.back{animation:screwin .55s ease-out}
@keyframes screwin{
  0%{transform:rotate(-900deg) translateY(-70px); opacity:0}
  55%{transform:rotate(-360deg) translateY(-10px); opacity:1}
  100%{transform:rotate(0) translateY(0); opacity:1}
}
#penaltyPop{
  position:absolute; left:50%; top:-1.5em; transform:translateX(-50%);
  color:var(--miss); font-size:1rem; white-space:nowrap;
  opacity:0; pointer-events:none;
}
#penaltyPop.show{animation:poppenalty 1.1s ease-out}
@keyframes poppenalty{
  0%{opacity:0; transform:translate(-50%,8px)}
  15%{opacity:1}
  100%{opacity:0; transform:translate(-50%,-16px)}
}
#score.penalty{animation:scoreflash .5s}
@keyframes scoreflash{0%,60%{color:var(--miss)}100%{color:var(--amber)}}
.rank-row .pname.locked{color:#596170; letter-spacing:.25em}

/* ---- 一本勝負: 段階が上がるほど熱を帯びる演出 ----
   本数に応じて body に os1〜os4 が付き、色味と発光だけが強まる。
   振動や明滅は使わず、目に負担をかけないようにしている。 */
#heatLayer{
  position:fixed; inset:0; pointer-events:none; z-index:1;
  opacity:0; transition:opacity 1.2s ease, background 1.2s ease;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(0,0,0,.55) 100%),
    radial-gradient(ellipse at 50% 110%, rgba(255,120,40,.16) 0%, transparent 60%);
}
body.os1 #heatLayer{opacity:.45}
body.os2 #heatLayer{
  opacity:.7;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 38%, rgba(0,0,0,.62) 100%),
    radial-gradient(ellipse at 50% 110%, rgba(255,100,30,.24) 0%, transparent 62%);
}
body.os3 #heatLayer{
  opacity:.85;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 32%, rgba(6,0,0,.7) 100%),
    radial-gradient(ellipse at 50% 110%, rgba(255,80,30,.32) 0%, transparent 65%);
}
body.os4 #heatLayer{
  opacity:1;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 26%, rgba(10,0,0,.78) 100%),
    radial-gradient(ellipse at 50% 112%, rgba(255,64,24,.4) 0%, transparent 68%);
}
/* 出題パネル: 段階ごとに枠が熱を持つ */
body.os1 .word-panel{border-color:#6a5a3a; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 18px rgba(245,179,1,.18), 0 10px 30px rgba(0,0,0,.4)}
body.os2 .word-panel{border-color:#8a5a2a; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 26px rgba(255,150,40,.28), 0 10px 30px rgba(0,0,0,.45)}
body.os3 .word-panel{border-color:#a4522a; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 34px rgba(255,110,40,.36), 0 10px 30px rgba(0,0,0,.5)}
body.os4 .word-panel{border-color:#c2452a; box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 0 44px rgba(255,80,40,.46), 0 10px 30px rgba(0,0,0,.55)}
.word-panel{transition:border-color 1s ease, box-shadow 1s ease}
/* ネジ板と HUD の数字も段階に合わせて色づく */
.plate{transition:box-shadow 1s ease, border-color 1s ease}
body.os2 .plate{border-color:#6a5340; box-shadow:0 6px 0 #10131a, 0 0 20px rgba(255,140,50,.14)}
body.os3 .plate{border-color:#7d5238; box-shadow:0 6px 0 #10131a, 0 0 28px rgba(255,110,45,.2)}
body.os4 .plate{border-color:#94472f; box-shadow:0 6px 0 #10131a, 0 0 36px rgba(255,80,40,.28)}
.hud b#score{transition:color .8s ease, text-shadow .8s ease}
body.os2 .hud b#score{color:#ffc24a}
body.os3 .hud b#score{color:#ff9a3c; text-shadow:0 0 12px rgba(255,140,50,.5)}
body.os4 .hud b#score{color:#ff7a3c; text-shadow:0 0 18px rgba(255,90,40,.65)}
/* ゲーム画面をオーバーレイより前面に置く */
#app{position:relative; z-index:2}

/* 段階到達テロップ */
#stagePop{
  position:fixed; left:50%; top:22%; transform:translateX(-50%);
  z-index:11; pointer-events:none; opacity:0;
  color:var(--amber); letter-spacing:.3em; white-space:nowrap;
  font-size:clamp(1.6rem,5vw,2.6rem);
  text-shadow:0 3px 0 #6b4e00, 0 0 24px rgba(245,179,1,.5);
}
#stagePop.show{animation:stagepop 1.6s ease-out}
@keyframes stagepop{
  0%{opacity:0; transform:translate(-50%,14px) scale(.92)}
  18%{opacity:1; transform:translate(-50%,0) scale(1)}
  75%{opacity:1}
  100%{opacity:0; transform:translate(-50%,-10px) scale(1)}
}

/* 一本勝負の終了演出 */
.word-panel.fatal{animation:fatalflash .6s ease-out}
@keyframes fatalflash{
  0%{border-color:var(--miss); box-shadow:0 0 30px rgba(255,92,92,.7)}
  100%{border-color:var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.4)}
}
/* タイムアタックの完走演出 */
.word-panel.clear{animation:clearflash .7s ease-out}
@keyframes clearflash{
  0%{border-color:var(--cyan); box-shadow:0 0 34px rgba(95,201,208,.75)}
  100%{border-color:var(--line); box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 10px 30px rgba(0,0,0,.4)}
}

/* =====================================================
   ネジの詩 — 和紙の巻物(ネジ打ち本編とは別世界のデザイン)
===================================================== */
:root{
  --washi:#f3ead8; --washi-d:#e6d8bd; --sumi:#231d18; --sumi-l:#6b5f53;
  --shu:#b8372a; --shu-d:#7e2519; --gold:#c9a24b;
}
.mincho{font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif}
/* タイトル画面のボタン */
.diff-btn.poem{
  font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  width:min(300px,90vw);
  background:
    repeating-linear-gradient(90deg, rgba(120,90,50,.035) 0 1px, transparent 1px 6px),
    linear-gradient(180deg,#f7efdf,#e7d9bd);
  border:2px solid #9c3a2a; color:var(--sumi);
  box-shadow:0 4px 0 #5a2419;
}
.diff-btn.poem .name{color:var(--shu); font-weight:800; letter-spacing:.25em}
.diff-btn.poem .desc{color:var(--sumi-l)}
.diff-btn.poem .kbd{color:#a08a70; letter-spacing:0}
.diff-btn.poem:hover,.diff-btn.poem:focus-visible{border-color:#d9503a}

/* 詩の画面ではページ全体を夜の座敷に */
body.washi{
  background:
    radial-gradient(ellipse at 50% 38%, rgba(110,70,35,.32), transparent 70%),
    repeating-radial-gradient(circle at 0 100%, transparent 0 9px, rgba(201,162,75,.05) 9px 10px) 0 0/40px 20px,
    #16100c;
}
.scroll-wrap{
  width:min(660px,94vw); margin:0 auto;
  font-family:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
}
.poem-hud{
  display:flex; justify-content:space-between; align-items:flex-end;
  color:#cdbb95; margin-bottom:.8rem; letter-spacing:.12em; font-size:.95rem;
}
.poem-hud b{color:#f2e2b8; font-size:1.45rem; font-weight:700; margin:0 .2em}
.poem-hud .ttl{color:#e8d6a8; font-size:1.05rem; letter-spacing:.3em}
.poem-hud .miss b{color:#e0715e}

/* 軸(ローラー) */
.roller{
  height:24px; border-radius:12px; position:relative; z-index:2; margin:0 4px;
  background:linear-gradient(180deg,#2e1b0c 0%,#7a4f2c 22%,#c08a55 42%,#9a6a3f 58%,#5a3a1e 80%,#241509 100%);
  box-shadow:0 5px 12px rgba(0,0,0,.55);
}
.roller::before,.roller::after{
  content:''; position:absolute; top:-5px; width:20px; height:34px; border-radius:5px;
  background:linear-gradient(180deg,#1f1308,#5a3a1e 35%,var(--gold) 50%,#5a3a1e 65%,#1f1308);
  box-shadow:0 3px 6px rgba(0,0,0,.5);
}
.roller::before{left:-13px}
.roller::after{right:-13px}

/* 和紙 */
.paper{
  position:relative; margin:0 16px; overflow:hidden; height:0;
  background:
    radial-gradient(ellipse at 25% 15%, rgba(255,255,255,.45), transparent 55%),
    radial-gradient(ellipse at 80% 90%, rgba(190,150,90,.14), transparent 60%),
    repeating-linear-gradient(0deg, rgba(120,90,50,.035) 0 2px, transparent 2px 5px),
    repeating-linear-gradient(90deg, rgba(120,90,50,.028) 0 1px, transparent 1px 7px),
    linear-gradient(180deg,#eadcbf,#f5ecda 14%,#f3ead8 86%,#e3d3b3);
  box-shadow:inset 0 10px 14px -10px rgba(60,35,15,.5), inset 0 -10px 14px -10px rgba(60,35,15,.5);
  transition:height .9s cubic-bezier(.3,.7,.2,1);
}
.paper.open{height:min(400px,58vh)}
/* 天地の金罫 */
.paper::before{
  content:''; position:absolute; left:22px; right:22px; top:12px; bottom:12px;
  border-top:1px solid rgba(160,120,50,.45); border-bottom:1px solid rgba(160,120,50,.45);
  pointer-events:none; z-index:1;
}
.poem-lines{
  position:absolute; left:0; right:0; top:0; padding:0 1.6rem;
  transition:transform .6s cubic-bezier(.3,.7,.2,1);
}
.pline{
  text-align:center; padding:.6rem 0; color:var(--sumi);
  opacity:.3; transition:opacity .5s ease;
}
.pline .pt{font-size:clamp(1.3rem,4.2vw,2rem); font-weight:800; letter-spacing:.2em; line-height:1.4}
.pline .pk{font-size:.85rem; color:var(--sumi-l); letter-spacing:.22em; margin-top:.1rem}
.pline .pr{font-size:.95rem; letter-spacing:.1em; margin-top:.35rem; min-height:1.3em; font-weight:500}
.pline .pr .done{color:var(--shu)}
.pline .pr .rest{color:#b0a28a}
.pline.cur{opacity:1}
.pline.cur .pt{
  text-decoration:underline; text-decoration-color:rgba(184,55,42,.55);
  text-decoration-thickness:2px; text-underline-offset:.35em;
}
.pline.past{opacity:.16}
.pline.fin{opacity:.72}
.pline.ink{animation:inkmiss .28s ease}
@keyframes inkmiss{
  0%{color:var(--shu)} 35%{transform:translateX(-5px)} 70%{transform:translateX(4px)} 100%{transform:none}
}

/* 開始前の「参・弐・壱」 */
.poem-cd{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:110px; height:110px; border-radius:50%; z-index:3;
  display:none; align-items:center; justify-content:center;
  font-size:3.6rem; font-weight:800; color:var(--washi);
  background:radial-gradient(circle at 40% 35%, #d34b3a, var(--shu) 60%, var(--shu-d));
  box-shadow:0 6px 18px rgba(80,20,10,.45);
}
.poem-cd.show{display:flex; animation:cdpop .45s ease-out}
@keyframes cdpop{0%{transform:translate(-50%,-50%) scale(.6); opacity:0}100%{transform:translate(-50%,-50%) scale(1); opacity:1}}

/* 落款(読み終えたら押される) */
.seal{
  position:absolute; right:30px; bottom:26px; z-index:3;
  width:66px; height:66px; border:3px solid var(--shu); border-radius:4px;
  display:grid; grid-template-columns:1fr 1fr; place-items:center;
  color:var(--shu); font-weight:800; font-size:1.2rem; line-height:1;
  background:rgba(184,55,42,.06);
  opacity:0; transform:rotate(-8deg) scale(1.7);
}
.seal.stamp{animation:stamp .5s cubic-bezier(.2,.9,.3,1.2) forwards}
@keyframes stamp{
  0%{opacity:0; transform:rotate(-8deg) scale(1.7)}
  100%{opacity:.9; transform:rotate(-8deg) scale(1)}
}

/* 結果(巻物の下に現れる) */
.poem-result{display:none; margin-top:1.3rem; text-align:center; color:#e8d9b5}
.poem-result.show{display:block; animation:fadein .5s ease}
.poem-result .cap{letter-spacing:.35em; color:#cdbb95; font-size:.95rem}
.poem-result .big{font-size:clamp(3rem,10vw,4.6rem); font-weight:800; color:#f5e6bd; letter-spacing:.05em; margin:.1em 0}
.poem-result .big small{font-size:.35em; margin-left:.2em}
.poem-result .sub{color:#cdbb95; letter-spacing:.12em}
.poem-result .newrec{color:#e0715e; min-height:1.5em; margin:.4rem 0 .6rem; letter-spacing:.2em}
.w-input{
  font-family:inherit; font-size:1.05rem; color:var(--sumi);
  background:var(--washi); border:2px solid #8a6a3f; border-radius:3px;
  padding:.6rem 1rem; width:min(260px,70vw); text-align:center; letter-spacing:.12em;
}
.w-input:focus{outline:none; border-color:var(--shu)}
.w-btn{

  background:linear-gradient(180deg,#f7efdf,#e4d4b4); color:var(--sumi);

.poem-hint{color:#8a7a60; font-size:.8rem; margin-top:1rem; letter-spacing:.15em; text-align:center}

/* ランキングの詩タブ */
.rank-tabs .btn.poem{font-family:'Shippori Mincho','Hiragino Mincho ProN',serif; font-weight:700; letter-spacing:.1em}

/* ---------- 永続ストレージ ----------
   GitHub Pages等の通常ブラウザでは localStorage に保存
   (ブラウザを閉じても消えない)。使えない環境では
   window.storage → メモリの順にフォールバック */
const memStore={};
const store={
  async get(key){
    try{
      if(typeof localStorage!=="undefined"){
        const v=localStorage.getItem("nejiuchi:"+key);
        if(v!==null) return {value:v};
      }
    }catch(e){}
    try{
      if(window.storage){
        const r=await window.storage.get(key);
        if(r) return r;
      }
    }catch(e){}
    return key in memStore ? {value:memStore[key]} : null;
  },
  async set(key,value){
    memStore[key]=value;
    try{
      if(typeof localStorage!=="undefined"){
        localStorage.setItem("nejiuchi:"+key,value);
        return;
      }
    }catch(e){}
    try{ if(window.storage) await window.storage.set(key,value); }catch(e){}
  }
};

// 2文字チャンクには「分解入力」(う+ぃ=uxi 等)も許可する
(function addDecomposed(){
  for(const key of Object.keys(KANA)){
    if(key.length===2){
      const a=KANA[key[0]], b=KANA[key[1]];
      if(a&&b){
        for(const x of a) for(const y of b){
          const r=x+y;
          if(!KANA[key].includes(r)) KANA[key].push(r);
        }
      }
    }
  }
})();

const VOWEL_N_Y = new Set(["a","i","u","e","o","n","y"]);

/* 特定の並びに複数の入力を許可するカスタムチャンク(最長一致で優先) */
const CUSTOM_CHUNKS={
  "2にん":["2ninn","2nin","futari","hutari","2nixn"], // 「2人」は数字でもふたりでもOK
  "3にん":["3ninn","3nin","sannnin","sannninn","3nixn"], // 「3人」は数字でもさんにんでもOK
  "2つ":["2tu","2tsu","futatu","futatsu","hutatu","hutatsu"], // 「2つ」はふたつでもOK
  "1つ":["1tu","1tsu","hitotu","hitotsu"], // 「1つ」はひとつでもOK
  "4ねんせい":["4nennsei","4nensei","yonennsei","yonensei"], // 「4年生」はよねんせいでもOK
  "4かい":["4kai","yonnkai","yonkai"], // 「4回」はよんかいでもOK
  "2しゅるい":["2syurui","2shurui","nisyurui","nishurui"], // 「2種類」はにしゅるいでもOK
  "2げん":["2genn","2gen","nigenn","nigen"], // 「2限」はにげんでもOK
  "3げん":["3genn","3gen","sangenn","sangen","sanngenn","sanngen"], // 「3限」はさんげんでもOK
  "3ぷん":["3punn","3pun","sanpunn","sanpun","sannpunn","sannpun","3hunn","3hun","sanhunn","sanhun","sannhunn","sannhun","3funn","3fun","sanfunn","sanfun","sannfunn","sannfun"], // 「3分」はさんぷん、ふんでもOK
};
const CUSTOM_KEYS=Object.keys(CUSTOM_CHUNKS).sort((a,b)=>b.length-a.length);

/* かな文字列 → チャンク配列 */
function tokenize(kana){
  const chunks=[];
  let i=0;
  while(i<kana.length){
    const custom=CUSTOM_KEYS.find(k=>kana.startsWith(k,i));
    if(custom){
      chunks.push({kana:custom, alts:[...CUSTOM_CHUNKS[custom]]});
      i+=custom.length;
      continue;
    }
    const two=kana.slice(i,i+2);
    const one=kana[i];
    if(two.length===2 && KANA[two]){ chunks.push({kana:two, alts:[...KANA[two]]}); i+=2; }
    else if(one==="っ"){ chunks.push({kana:"っ", soku:true, alts:["xtu","ltu","ltsu"]}); i++; }
    else if(one==="ん"){ chunks.push({kana:"ん", nn:true, alts:["nn","xn"]}); i++; }
    else if(KANA[one]){ chunks.push({kana:one, alts:[...KANA[one]]}); i++; }
    else { chunks.push({kana:one, alts:[one], literal:true}); i++; } // 数字・英字など、そのまま入力する文字
  }
  // 「っ」に次チャンク子音の重ね打ちを追加
  for(let c=0;c<chunks.length;c++){
    if(chunks[c].soku && chunks[c+1]){
      const firsts=new Set();
      for(const alt of chunks[c+1].alts){
        const f=alt[0];
        if(!VOWEL_N_Y.has(f)) firsts.add(f);
      }
      chunks[c].alts=[...firsts, ...chunks[c].alts];
    }
  }
  return chunks;
}

/* ---------- タイピング状態 ---------- */
let chunks=[], chunkIdx=0, buf="", typedRomaji="", nAmbig=false;

function setWord(kana){
  chunks=tokenize(kana); chunkIdx=0; buf=""; typedRomaji=""; nAmbig=false;
}
function nextChunkStartsWith(key){
  const nc=chunks[chunkIdx+1];
  if(!nc) return false;
  return nc.alts.some(a=>a[0]===key);
}
/* 戻り値: "ok" | "done"(単語完了) | "miss" */
function handleKey(rawKey){
  if(chunkIdx>=chunks.length) return "miss";
  const ch=chunks[chunkIdx];
  // 数字・英字などの直接入力チャンクは大文字小文字を区別する(例: "E"はshift+Eが必要)
  // かな入力チャンクは小文字化して判定する
  const key = ch.literal ? rawKey : rawKey.toLowerCase();
  // 「ん」+ n: 次がナ行なら n単打で確定してキーを次チャンクへ(nna=んな のIME挙動)
  if(ch.nn && buf==="n" && key==="n" && nextChunkStartsWith("n")){
    completeChunk("n");
    nAmbig=true; // 後で「nnだった」と再解釈できるよう記録
    return handleKey(rawKey);
  }
  const newBuf=buf+key;
  const matches=ch.alts.filter(a=>a.startsWith(newBuf));
  if(matches.length){
    buf=newBuf;
    if(newBuf.length>1) nAmbig=false;
    const exact=matches.find(a=>a===newBuf);
    const longer=ch.alts.some(a=>a.length>newBuf.length && a.startsWith(newBuf));
    if(exact && !longer) return completeChunk(newBuf);
    return "ok";
  }
  // 「ん」を n 1打で確定 → 次チャンクへキーを回す
  if(ch.nn && buf==="n" && !VOWEL_N_Y.has(key) && nextChunkStartsWith(key)){
    completeChunk("n");
    return handleKey(rawKey);
  }
  // 完成形と同じ長さまで打っていて、より長い候補待ちだった場合(nn待ちのn等)
  if(ch.alts.includes(buf)){
    if(ch.nn && VOWEL_N_Y.has(key)) return "miss"; // んの後に母音/y/nは nn 必須
    completeChunk(buf);
    return handleKey(rawKey);
  }
  // 直前の「ん」のnが実はnnの1打目だった場合の再解釈(nnna=んな 等)
  if(nAmbig && buf==="n"){
    nAmbig=false;
    typedRomaji+="n"; // んをnn扱いに訂正
    buf="";
    return handleKey(rawKey);
  }
  return "miss";
}
function completeChunk(romaji){
  typedRomaji+=romaji;
  buf="";
  chunkIdx++;
  return chunkIdx>=chunks.length ? "done" : "ok";
}
/* 残りローマ字の表示用文字列 */
function remainingRomaji(){
  let s="";
  for(let i=chunkIdx;i<chunks.length;i++){
    const ch=chunks[i];
    let alt;
    if(i===chunkIdx){
      alt=ch.alts.find(a=>a.startsWith(buf))||ch.alts[0];
      s+=alt.slice(buf.length);
      continue;
    }
    if(ch.soku && chunks[i+1]){
      const nf=(chunks[i+1].alts[0]||"x")[0];
      alt=VOWEL_N_Y.has(nf)?ch.alts.find(a=>a.length>1):nf;
    } else if(ch.nn){
      const nc=chunks[i+1];
      alt=(nc && nc.alts.some(a=>!VOWEL_N_Y.has(a[0])))?"n":"nn";
    } else alt=ch.alts[0];
    s+=alt;
  }
  return s;
}

/* ---------- 効果音 ---------- */
let audioCtx=null;
function beep(freq,dur,type,gain){
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.value=gain;
    g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime+dur);
  }catch(e){}
}

/* ---------- 記録(ベスト) ----------
   スコア系は本数(大きいほど良い)、タイム系は秒(小さいほど良い) */
async function loadBest(d){
  try{
    const r=await store.get("best-"+d);
    if(!r) return null;
    const v=parseFloat(r.value);
    return isNaN(v)?null:v;
  }catch(e){ return null; }
}
async function saveBest(d,v){
  try{ await store.set("best-"+d,String(v)); }catch(e){}
}
/* 新記録かどうか(モードの評価方向に応じて判定) */
function isBetterValue(v,best,d){
  if(best==null) return true;
  return isTimeRanked(d) ? v<best : v>best;
}

/* ---------- 一本勝負の緊張段階 ---------- */
function applyStageClass(){
  const b=document.body;
  b.classList.remove("os1","os2","os3","os4");
  if(oneshotStage>0) b.classList.add("os"+oneshotStage);
}
function resetStage(){
  oneshotStage=0;
  applyStageClass();
}
function showStagePop(text){
  const el=$("stagePop");
  el.textContent=text;
  el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
}
/* 本数がしきい値を跨いだら段階を1つ上げる */
function updateOneshotStage(){
  let lv=0;
  for(const th of ONESHOT_STAGES){ if(score>=th) lv++; }
  if(lv>oneshotStage){
    oneshotStage=lv;
    applyStageClass();
    showStagePop(ONESHOT_STAGES[lv-1]+"本");
    sndStageUp();
  }
}

/* 一本勝負: 抜いた本数に応じて出題元の難易度を抽選する
   score=0 → イージー100% / score>=30 → 1:1:1 */
function pickOneshotSet(){
  const pn=Math.min(Math.max(score,0)/ONESHOT_FULL_MIX,1);
  const ph=Math.min(Math.max(score-ONESHOT_HARD_FROM,0)/(ONESHOT_FULL_MIX-ONESHOT_HARD_FROM),1);
  const wN=pn/3, wH=ph/3, wE=Math.max(1-wN-wH,0);
  const r=Math.random()*(wE+wN+wH);
  if(r<wE) return WORDS_EASY;
  if(r<wE+wN) return WORDS_NORMAL;
  return WORDS_HARD;
}

/* タイムアタック: 出題する語を重複なしで goal 本ぶん先に決めておく */
function buildTaQueue(d){
  const conf=TA_MODES[d];
  const pool=[...WORD_SETS[conf.set]];
  for(let i=pool.length-1;i>0;i--){ // フィッシャー–イェーツ
    const j=Math.floor(Math.random()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }
  taGoal=Math.min(conf.goal,pool.length);
  taQueue=pool.slice(0,taGoal);
}

function setCurrentWord(w){
  currentWord=w;
  setWord(w.k);
  $("wordText").textContent=w.t;
  $("wordKana").textContent=w.t===w.k?"\u00a0":w.k;
  renderRomaji();
}
function renderNextWord(){
  const el=$("nextWord");
  if(!isTA(diff)){ el.innerHTML="&nbsp;"; return; }
  if(nextWord){
    el.innerHTML='<span class="lbl">NEXT</span>';
    el.appendChild(document.createTextNode(nextWord.t));
  }else{
    el.innerHTML='<span class="lbl">NEXT</span>— ラスト1本 —';
  }
}

function pickWord(){
  if(isTA(diff)){
    // キューの先頭を出題し、その次を先読み表示する
    const w=taQueue.shift();
    if(!w){ finishTa(); return; }
    setCurrentWord(w);
    nextWord=taQueue[0]||null;
    renderNextWord();
    return;
  }
  const pool = (diff==="oneshot") ? pickOneshotSet() : words;
  let w;
  for(let tries=0;tries<12;tries++){
    w=pool[Math.floor(Math.random()*pool.length)];
    if(pool.length<=1 || w.k!==lastWordKey) break;
  }
  lastWordKey=w.k;
  setCurrentWord(w);
}

  $("romaji").innerHTML=

}

function startTimer(){
  const t0=Date.now();
  if(isTA(diff) || diff==="oneshot"){
    // 時間無制限: 経過時間を数え上げるだけ
    timerId=setInterval(()=>{
      elapsed=(Date.now()-t0)/1000;
      $("time").textContent=elapsed.toFixed(1);
    },100);
    return;
  }
  timerId=setInterval(()=>{
    timeLeft=GAME_SECONDS-(Date.now()-t0)/1000;
    if(timeLeft<=0){ timeLeft=0; endGame(); }
    $("time").textContent=Math.ceil(timeLeft);
    const f=$("timefill");
    f.style.width=(timeLeft/GAME_SECONDS*100)+"%";
    f.classList.toggle("low",timeLeft<=10);
  },100);
}

  sndClear();
  $("wordPanel").classList.add("clear");
  clearWordPanel();
  endGame();

async function endGame(){
  clearInterval(timerId); running=false;
  resetStage();   // 背景の熱演出を戻す
  recordStats(score); // ランキング登録の有無に関係なく記録
  const ta=isTA(diff);
  const value = ta ? Number(elapsed.toFixed(2)) : score;
  const best=await loadBest(diff);
  const isNew=isBetterValue(value,best,diff);
  if(isNew) await saveBest(diff,value);
  const shownBest = isNew ? value : best;
  $("resultDiff").textContent=`— ${DIFF_LABEL[diff]} —`;
  $("resultCount").classList.toggle("ta",ta);
  if(ta){
    $("resultCaption").textContent=`${taGoal}本タイム`;
    $("resultScore").textContent=elapsed.toFixed(2);
    $("resultUnit").textContent="秒";
    $("resultSubLine").textContent=`ミス ${miss}回 / 自己ベスト ${fmtTime(shownBest)}`;
  }else{
    $("resultCaption").textContent="抜いたネジ";
    $("resultScore").textContent=score;
    $("resultUnit").textContent="本";
    $("resultSubLine").textContent = diff==="oneshot"
      ? `記録 ${elapsed.toFixed(1)}秒 / 自己ベスト ${shownBest==null?0:shownBest}本`
      : `ミス ${miss}回 / 自己ベスト ${shownBest==null?0:shownBest}本`;
  }
  $("resultNew").textContent=isNew?"★ 自己ベスト更新! ★":"";
  $("nameInput").value=playerName;
  $("regBtn").disabled=false;
  $("regStatus").textContent=db?"":"※Firebase未設定のためランキング登録はできません";

}

const START_KEYS={"1":"easy","2":"normal","3":"hard","4":"ta-easy","5":"ta-normal","6":"ta-hard","7":"oneshot"};
document.addEventListener("keydown",e=>{
  // 名前入力中はゲーム操作を無効化(Enterで登録)
  if(e.target && e.target.tagName==="INPUT"){
    if(e.key==="Enter"){
      e.preventDefault();
      if(e.target.id==="poemName") $("poemRegBtn").click(); else $("regBtn").click();
    }
    if(e.key==="Escape" && e.target.id==="poemName"){ stopPoem(); show("title"); }
    return;
  }
  if(scene==="title"){
    if(START_KEYS[e.key]) startGame(START_KEYS[e.key]);
    if(e.key==="8") startPoem(POEMS[0]);
    return;
  }
  if(scene==="poem"){ poemKey(e); return; }
  if(scene==="ranking"){
    if(e.key==="Escape") show("title");
    return;
  }
  if(scene==="dict"){
    if(e.key==="Escape") show("title");
    return;
  }
  if(scene==="result"){
    if(e.key==="Enter") startGame(diff);
    if(e.key==="Escape") show("title");
    return;
  }
  // ゲーム中
  if(e.key==="Escape"){ clearInterval(timerId); running=false; resetStage(); clearWordPanel(); show("title"); return; }
  if(!running) return;
  const key=e.key;
  if(!/^[a-zA-Z0-9\-'!?,.~\/%&]$/.test(key)) return;
  e.preventDefault();
  const r=handleKey(key);
  if(r==="miss"){
    miss++; $("miss").textContent=miss;
    const p=$("wordPanel");
    p.classList.remove("shake"); void p.offsetWidth; p.classList.add("shake");
    // 一本勝負: 1ミスで即終了
    if(diff==="oneshot"){
      running=false;
      sndFatal();
      p.classList.add("fatal");
      endGame();
      return;
    }
    sndMiss();
    // タイムアタックはミスしてもペナルティ無し(回数だけ記録)
    if(isTA(diff)) return;
    // ミス上限でネジが1本戻る
    if(miss % MISS_PENALTY[diff]===0 && score>0){
      score--; $("score").textContent=score;
      reviveScrew();
      sndPenalty();
      const sc=$("score");
      sc.classList.remove("penalty"); void sc.offsetWidth; sc.classList.add("penalty");
      const pop=$("penaltyPop");
      pop.classList.remove("show"); void pop.offsetWidth; pop.classList.add("show");
    }
  } else {
    if(diff==="oneshot") sndTypeStage(); else sndType();
    renderRomaji();
    if(r==="done"){
      score++;
      sndDone();
      removeScrew();
      unlockWord(currentWord.k);
      if(isTA(diff)){
        // 残り本数とゲージを更新
        const remain=Math.max(taGoal-score,0);
        $("score").textContent=remain;
        $("timefill").style.width=(score/taGoal*100)+"%";
        if(remain<=0){ finishTa(); return; }
      }else{
        $("score").textContent=score;
        if(diff==="oneshot") updateOneshotStage();
      }
      pickWord();
    }
  }
});

/* 記録の優劣比較(正なら a のほうが上位)
   タイムアタック: タイムが短いほど上、同タイムはミスが少ないほど上
   一本勝負: 本数が多いほど上、同本数はタイムが短いほど上
   スコアアタック: 本数が多いほど上 */
function betterRecord(a,b,d){
  if(isTimeRanked(d)){
    const at=(a.e==null)?Infinity:a.e, bt=(b.e==null)?Infinity:b.e;
    if(at!==bt) return bt-at;
    const am=(a.m==null)?Infinity:a.m, bm=(b.m==null)?Infinity:b.m;
    if(am!==bm) return bm-am;
    return 0;
  }
  if(a.s!==b.s) return a.s-b.s;
  if(d==="oneshot"){
    const ae=(a.e==null)?Infinity:a.e, be=(b.e==null)?Infinity:b.e;
    return be-ae;
  }
  return 0;
}

/* 登録: 1人(同名)につき MAX_ENTRIES_PER_PLAYER 件まで。
   既に上限なら、自分の一番弱い記録を上回った時だけ入れ替える */
async function submitScore(name,d,extra){
  const ref=db.ref("nejiuchi/scores/"+d);
  const snap=await ref.orderByChild("n").equalTo(name).once("value");
  const mine=[];
  snap.forEach(c=>{ const v=c.val(); mine.push({key:c.key, s:v.s, e:v.e, m:v.m}); });
  const entry={n:name, s:extra.s, t:Date.now()};
  if(extra.e!=null) entry.e=extra.e;
  if(extra.m!=null) entry.m=extra.m;
  if(mine.length>=MAX_ENTRIES_PER_PLAYER){
    mine.sort((a,b)=>betterRecord(a,b,d)); // 弱い順
    if(betterRecord(entry,mine[0],d)<=0) return {saved:false};
    await ref.child(mine[0].key).remove();
    // 万一3件以上あった場合の掃除
    for(let i=1;i<=mine.length-MAX_ENTRIES_PER_PLAYER;i++){
      await ref.child(mine[i].key).remove();
    }
  }
  await ref.push(entry);
  return {saved:true};
}

async function fetchRanking(d){
  // タイム系は昇順に並べたいので、取得は全件から上位を選ぶ
  const ref=db.ref("nejiuchi/scores/"+d);
  const snap = isTimeRanked(d)
    ? await ref.orderByChild("e").limitToFirst(RANKING_SIZE).once("value")
    : await ref.orderByChild("s").limitToLast(RANKING_SIZE).once("value");
  const rows=[];
  snap.forEach(c=>{ rows.push(c.val()); });
  rows.sort((a,b)=> -betterRecord(a,b,d) || a.t-b.t); // 優劣→同値なら先着順
  return rows;
}

}

/* =====================================================
   ネジの詩: 巻物モード
   一行ずつ順番に打ち、打ち終えると巻物が一段せり上がる。
   ミスはペナルティ無し(回数だけ記録)、タイムで番付。
===================================================== */
let poem=null, poemIdx=0, poemMiss=0, poemElapsed=0, poemTimer=null;
let poemState="idle";            // idle | countdown | play | done
let poemRows=[];                 // 各行の {row, pr} 要素
let poemCdTimers=[];

function stopPoem(){
  clearInterval(poemTimer);
  poemCdTimers.forEach(clearTimeout); poemCdTimers=[];
  poemState="idle";
}
/* 行の要素を組み立てる */
function buildPoemLines(){
  const wrap=$("poemLines");
  wrap.innerHTML="";
  wrap.style.transform="translateY(0px)";
  poemRows=poem.lines.map(l=>{
    const row=document.createElement("div"); row.className="pline";
    const pt=document.createElement("div"); pt.className="pt"; pt.textContent=l.t;
    const pk=document.createElement("div"); pk.className="pk"; pk.textContent=l.k;
    const pr=document.createElement("div"); pr.className="pr"; pr.innerHTML="&nbsp;";
    row.appendChild(pt); row.appendChild(pk); row.appendChild(pr);
    wrap.appendChild(row);
    return {row,pr};
  });
}
/* 現在行が巻物の上寄り(3割の位置)に来るよう全体をずらす */
function scrollPoemTo(i){
  const r=poemRows[i]; if(!r) return;
  const vh=(typeof window!=="undefined" && window.innerHeight) ? window.innerHeight : 800;
  const paperH=Math.min(400, vh*0.58);
  const anchor=paperH*0.3;
  const top=r.row.offsetTop||0;
  $("poemLines").style.transform=`translateY(${Math.round(anchor-top)}px)`;
}
function setPoemLine(i){
  poemRows.forEach((r,j)=>{
    r.row.classList.remove("cur","past","fin");
    if(j<i) r.row.classList.add("past");
    else if(j===i) r.row.classList.add("cur");
    if(j!==i) r.pr.innerHTML="&nbsp;";
  });
  setWord(poem.lines[i].k);
  renderPoemRomaji();
  scrollPoemTo(i);
  $("poemLineNo").textContent=i;
}
function renderPoemRomaji(){
  const r=poemRows[poemIdx]; if(!r) return;
  r.pr.innerHTML=`<span class="done">${typedRomaji+buf}</span><span class="rest">${remainingRomaji()}</span>`;
}

function startPoem(p){
  // 他モードの状態を片付ける
  clearInterval(timerId); running=false; resetStage(); clearWordPanel();
  stopPoem();
  poem=p||POEMS[0];
  poemIdx=0; poemMiss=0; poemElapsed=0;
  poemState="countdown";
  diff=POEM_KEY(poem);
  $("poemTitleHud").textContent=poem.title;
  $("poemTime").textContent="0.0";
  $("poemMiss").textContent="0";
  $("poemLineNo").textContent="0";
  $("poemLineTotal").textContent=poem.lines.length;
  $("poemResult").classList.remove("show");
  $("poemHint").style.display="";
  $("poemSeal").classList.remove("stamp");
  $("poemCd").classList.remove("show");
  const paper=$("poemPaper");
  paper.classList.remove("open");
  buildPoemLines();
  show("poem");
  // 巻物を広げる → 参・弐・壱 → 始め
  poemCdTimers.push(setTimeout(()=>{ paper.classList.add("open"); },40));
  poemCdTimers.push(setTimeout(()=>{ scrollPoemTo(0); },80));
  const cd=$("poemCd");
  const steps=["参","弐","壱"];
  steps.forEach((ch,i)=>{
    poemCdTimers.push(setTimeout(()=>{
      cd.textContent=ch;
      cd.classList.remove("show"); void cd.offsetWidth; cd.classList.add("show");
      sndCdW();
    },950+i*700));
  });
  poemCdTimers.push(setTimeout(()=>{
    cd.classList.remove("show");
    poemState="play";
    setPoemLine(0);
    const t0=Date.now();
    poemTimer=setInterval(()=>{
      poemElapsed=(Date.now()-t0)/1000;
      $("poemTime").textContent=poemElapsed.toFixed(1);
    },100);
  },950+steps.length*700));
}

function poemKey(e){
  if(e.key==="Escape"){ stopPoem(); show("title"); return; }
  if(poemState==="done"){
    if(e.key==="Enter") startPoem(poem);
    return;
  }
  if(poemState!=="play") return;
  const key=e.key;
  if(!/^[a-zA-Z0-9\-'!?,.~\/%&]$/.test(key)) return;
  e.preventDefault();
  const r=handleKey(key);
  if(r==="miss"){
    poemMiss++; $("poemMiss").textContent=poemMiss;
    sndInk();
    const row=poemRows[poemIdx].row;
    row.classList.remove("ink"); void row.offsetWidth; row.classList.add("ink");
    return;
  }
  sndBrush();
  renderPoemRomaji();
  if(r==="done"){
    poemIdx++;
    $("poemLineNo").textContent=poemIdx;
    if(poemIdx>=poem.lines.length){ finishPoem(); return; }
    sndLine();
    setPoemLine(poemIdx);
  }
}

async function finishPoem(){
  clearInterval(poemTimer);
  poemState="done";
  // 経過時間を確定(表示の最終更新)
  $("poemTime").textContent=poemElapsed.toFixed(1);
  poemRows.forEach(r=>{ r.row.classList.remove("cur","past"); r.row.classList.add("fin"); r.pr.innerHTML="&nbsp;"; });
  sndBell();
  $("poemSeal").classList.add("stamp");
  recordStats(0); // 総プレイ回数には数える(ネジは抜かない)
  const key=POEM_KEY(poem);
  const value=Number(poemElapsed.toFixed(2));
  const best=await loadBest(key);
  const isNew=isBetterValue(value,best,key);
  if(isNew) await saveBest(key,value);
  $("poemResTime").textContent=value.toFixed(2);
  $("poemResSub").textContent=`誤り ${poemMiss}回 ・ 自己最速 ${fmtTime(isNew?value:best)}`;
  $("poemResNew").textContent=isNew?"― 自己最速 更新 ―":"";
  $("poemName").value=playerName;
  $("poemRegBtn").disabled=false;
  $("poemRegStatus").textContent=db?"":"※Firebase未設定のため番付に載せられません";
  $("poemHint").style.display="none";
  $("poemResult").classList.add("show");
  refreshBestLine();
}

/* ---------- ネジ抜き辞典 ----------
   開放記録は「読み(k)」単位のひとつの集合で管理する。
   これにより単語の難易度を移動しても開放状態が引き継がれる。
   旧形式(easy/normal/hardごとに別集合)のデータがあれば
   初回読み込み時に自動でひとつの集合へ統合する。 */
let unlocked=new Set();
(async()=>{
  try{
    const r=await store.get("dict");
    if(r&&r.value){
      const o=JSON.parse(r.value);
      if(Array.isArray(o)){
        unlocked=new Set(o); // 新形式: 配列そのまま
      }else{
        // 旧形式 {easy:[...],normal:[...],hard:[...]} → 統合
        const merged=new Set();
        for(const d of DICT_TABS) for(const k of (o[d]||[])) merged.add(k);
        unlocked=merged;
        saveDict(); // 新形式で保存し直す
      }
    }
  }catch(e){}
})();
async function saveDict(){
  try{ await store.set("dict",JSON.stringify([...unlocked])); }catch(e){}
}
function unlockWord(k){
  if(!unlocked.has(k)){ unlocked.add(k); saveDict(); }
}
function openDict(d){
  for(const t of DICT_TABS) $("dtab-"+t).classList.toggle("active",d===t);
  show("dict");
  const arr=WORD_SETS[d];
  const got=arr.filter(w=>unlocked.has(w.k)).length;
  let allGot=0, allTotal=0;
  for(const dd of DICT_TABS){
    allGot+=WORD_SETS[dd].filter(w=>unlocked.has(w.k)).length;
    allTotal+=WORD_SETS[dd].length;
  }
  const pct=v=>Math.round(v*100);
  $("dictRate").textContent=
    `開放率 — ${DIFF_LABEL[d]}: ${got}/${arr.length} (${pct(got/arr.length)}%) / 全体: ${allGot}/${allTotal} (${pct(allGot/allTotal)}%)`;
  const list=$("dictList");
  list.innerHTML="";
  arr.forEach((w,i)=>{
    const open=unlocked.has(w.k);
    const li=document.createElement("li");
    li.className="rank-row";
    li.innerHTML=`<span class="pos">${String(i+1).padStart(2,"0")}</span><span class="pname${open?"":" locked"}"></span>`;
    li.querySelector(".pname").textContent=open?w.t:"？？？";
    list.appendChild(li);
  });
}

/* ---------- 全体統計(総プレイ回数・抜いたネジ累計) ---------- */
async function recordStats(screws){
  // 端末ローカルにも記録(オフライン時のフォールバック用)
  try{
    let s={plays:0,screws:0};
    try{
      const r=await store.get("stats");
      if(r&&r.value) s=JSON.parse(r.value);
    }catch(e){}
    s.plays=(s.plays||0)+1;
    s.screws=(s.screws||0)+screws;
    await store.set("stats",JSON.stringify(s));
  }catch(e){}
  // Firebaseに全プレイヤー合算で記録(ランキング登録不要)
  if(db){
    try{
      db.ref("nejiuchi/stats/plays").transaction(v=>(v||0)+1);
      db.ref("nejiuchi/stats/screws").transaction(v=>(v||0)+screws);
    }catch(e){}
  }
}
async function refreshStatsLine(){
  const el=$("statsLine");
  if(!el) return;
  if(db){
    try{
      const snap=await db.ref("nejiuchi/stats").once("value");
      const v=snap.val()||{};
      el.textContent=`みんなの記録 — 総プレイ ${v.plays||0}回 / 抜かれたネジ 累計${v.screws||0}本`;
      return;
    }catch(e){}
  }
  try{
    const r=await store.get("stats");
    const s=r&&r.value?JSON.parse(r.value):{plays:0,screws:0};
    el.textContent=`この端末の記録 — 総プレイ ${s.plays||0}回 / 抜いたネジ 累計${s.screws||0}本`;
  }catch(e){ el.textContent=""; }
}
